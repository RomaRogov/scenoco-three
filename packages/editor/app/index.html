<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SceNoCo Editor</title>
    <style>
      html, body { margin: 0; height: 100%; background: #15181f; overflow: hidden; color: #d6e2f0; }
      canvas { display: block; width: 100%; height: 100%; }
      :root { --panel: rgba(20, 24, 32, 0.92); --line: #2a3344; --accent: #4af0e0; }
      /* Each side is a slide-out drawer: a panel + a thin arrow tab that stays on
         screen when collapsed. */
      .sc-drawer { position: fixed; top: 0; bottom: 0; z-index: 5; display: flex;
        transition: transform 0.22s ease; }
      .sc-left { left: 0; }
      .sc-right { right: 0; }
      .sc-left.collapsed { transform: translateX(calc(-100% + 22px)); }
      .sc-right.collapsed { transform: translateX(calc(100% - 22px)); }
      .sc-panel {
        width: 280px; height: 100%; background: var(--panel); overflow: auto;
        font: 12px/1.5 ui-monospace, monospace; backdrop-filter: blur(6px);
      }
      .sc-left .sc-panel { border-right: 1px solid var(--line); }
      .sc-right .sc-panel { border-left: 1px solid var(--line); }
      .sc-tab {
        flex: 0 0 22px; background: var(--panel); color: #9fe7ff; cursor: pointer;
        border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line);
        font-size: 15px; display: flex; align-items: center; justify-content: center;
      }
      .sc-tab:hover { color: var(--accent); background: rgba(74, 240, 224, 0.1); }
      .sc-title { padding: 8px 12px; font-weight: 700; color: #9fe7ff; letter-spacing: 0.06em;
        text-transform: uppercase; font-size: 11px; border-bottom: 1px solid var(--line); position: sticky; top: 0;
        background: var(--panel); }
      .sc-node { display: flex; align-items: center; gap: 4px; min-height: 28px; padding: 2px 8px; cursor: pointer;
        white-space: nowrap; overflow: hidden; }
      .sc-node:hover { background: rgba(74, 240, 224, 0.08); }
      .sc-node.sel { background: rgba(74, 240, 224, 0.18); color: #eafdff; }
      .sc-node .ty { color: #6f93b8; }
      .sc-caret { flex: 0 0 14px; width: 14px; text-align: center; color: #6f93b8; cursor: pointer; user-select: none; }
      .sc-inspector { padding: 8px 10px; }
      .sc-sec { display: flex; align-items: center; gap: 4px; margin: 10px 0 4px; color: #9fe7ff; font-weight: 700;
        border-bottom: 1px solid var(--line); padding-bottom: 3px; cursor: pointer; user-select: none;
        text-transform: uppercase; letter-spacing: 0.04em; font-size: 11px; }
      .sc-sec.sc-sec-plain { cursor: default; }
      .sc-sec .sc-caret { flex: 0 0 12px; width: 12px; }
      .sc-sec-body { padding: 1px 0 2px; }
      .sc-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 30px; padding: 2px 0; }
      .sc-row .k { color: #8fa6c4; flex: 0 0 auto; }
      .sc-row .v { color: #e7f0fb; text-align: right; word-break: break-word; display: flex; align-items: center;
        justify-content: flex-end; gap: 4px; }
      .sc-empty { color: #6f8099; padding: 12px 0; }
      /* editable controls — 16px font avoids iOS tap-zoom; generous hit areas for touch */
      .sc-input { background: #0e1219; color: #e7f0fb; border: 1px solid var(--line); border-radius: 5px;
        padding: 4px 6px; font: 16px ui-monospace, monospace; min-height: 28px; box-sizing: border-box; }
      .sc-input:focus { outline: none; border-color: var(--accent); }
      .sc-num { width: 64px; text-align: right; }
      .sc-axes { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
      .sc-axis { display: flex; align-items: center; gap: 2px; }
      .sc-axis-k { color: #6f93b8; font-size: 11px; width: 12px; text-align: center; }
      .sc-scrub { cursor: ew-resize; touch-action: none; }
      .sc-toggle { width: 22px; height: 22px; accent-color: var(--accent); }
      .sc-color { display: flex; align-items: center; gap: 5px; }
      .sc-swatch { width: 30px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 5px;
        background: none; cursor: pointer; }
      .sc-hex { width: 78px; }
      .sc-select { min-width: 96px; cursor: pointer; }
      #hint { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); padding: 6px 14px;
        border-radius: 8px; background: rgba(0,0,0,.55); color: #9fb5cf; font: 11px ui-monospace, monospace;
        pointer-events: none; }
      /* floating editing toolbar (touch-reachable, top center) */
      .sc-toolbar { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 6;
        display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 10px;
        background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(6px); }
      .sc-tbtn { min-width: 38px; height: 34px; padding: 0 10px; border: 1px solid transparent; border-radius: 7px;
        background: transparent; color: #cfe0f2; font: 15px ui-monospace, monospace; cursor: pointer; }
      .sc-tbtn:hover:not(:disabled) { background: rgba(74, 240, 224, 0.12); }
      .sc-tbtn.active { background: rgba(74, 240, 224, 0.2); border-color: var(--accent); color: #eafdff; }
      .sc-tbtn:disabled { opacity: 0.35; cursor: default; }
      .sc-tbtn.sc-save { font-size: 12px; font-weight: 700; }
      .sc-tbtn.sc-save.dirty { color: #0e1219; background: var(--accent); border-color: var(--accent); }
      .sc-tbtn.sc-save.dirty::after { content: '•'; margin-left: 4px; }
      .sc-tsep { width: 1px; height: 22px; background: var(--line); margin: 0 2px; }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="hint">tap to select · right-drag look · WASD move · Q/E down/up · G/R/Y gizmo move/rotate/scale</div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
