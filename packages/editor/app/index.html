<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SceNoCo Editor</title>
    <style>
      html, body { margin: 0; height: 100%; background: #15181f; overflow: hidden; color: #d6e2f0; }
      canvas { display: block; width: 100%; height: 100%; }
      :root { --panel: rgba(20, 24, 32, 0.92); --line: #2a3344; --accent: #4af0e0; }
      /* Each side is a slide-out drawer: a panel + a thin arrow tab that stays on
         screen when collapsed. */
      .sc-drawer { position: fixed; top: 0; bottom: 0; z-index: 5; display: flex;
        transition: transform 0.22s ease; }
      .sc-left { left: 0; }
      .sc-right { right: 0; }
      .sc-left.collapsed { transform: translateX(calc(-100% + 22px)); }
      .sc-right.collapsed { transform: translateX(calc(100% - 22px)); }
      .sc-panel {
        width: 280px; height: 100%; background: var(--panel); overflow: auto;
        font: 12px/1.5 ui-monospace, monospace; backdrop-filter: blur(6px);
      }
      .sc-left .sc-panel { border-right: 1px solid var(--line); }
      .sc-right .sc-panel { border-left: 1px solid var(--line); }
      .sc-tab {
        flex: 0 0 22px; background: var(--panel); color: #9fe7ff; cursor: pointer;
        border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line);
        font-size: 15px; display: flex; align-items: center; justify-content: center;
      }
      .sc-tab:hover { color: var(--accent); background: rgba(74, 240, 224, 0.1); }
      .sc-title { padding: 8px 12px; font-weight: 700; color: #9fe7ff; letter-spacing: 0.06em;
        text-transform: uppercase; font-size: 11px; border-bottom: 1px solid var(--line); position: sticky; top: 0;
        background: var(--panel); }
      .sc-node { display: flex; align-items: center; gap: 4px; min-height: 28px; padding: 2px 8px; cursor: pointer;
        white-space: nowrap; overflow: hidden; }
      .sc-node:hover { background: rgba(74, 240, 224, 0.08); }
      .sc-node.sel { background: rgba(74, 240, 224, 0.18); color: #eafdff; }
      .sc-node .ty { color: #6f93b8; }
      .sc-caret { flex: 0 0 14px; width: 14px; text-align: center; color: #6f93b8; cursor: pointer; user-select: none; }
      .sc-inspector { padding: 8px 10px; }
      .sc-sec { display: flex; align-items: center; gap: 4px; margin: 10px 0 4px; color: #9fe7ff; font-weight: 700;
        border-bottom: 1px solid var(--line); padding-bottom: 3px; cursor: pointer; user-select: none;
        text-transform: uppercase; letter-spacing: 0.04em; font-size: 11px; }
      .sc-sec.sc-sec-plain { cursor: default; }
      .sc-sec .sc-caret { flex: 0 0 12px; width: 12px; }
      .sc-sec-body { padding: 1px 0 2px; }
      .sc-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 30px; padding: 2px 0; }
      .sc-row .k { color: #8fa6c4; flex: 0 0 auto; }
      .sc-row .v { color: #e7f0fb; text-align: right; word-break: break-word; display: flex; align-items: center;
        justify-content: flex-end; gap: 4px; }
      .sc-empty { color: #6f8099; padding: 12px 0; }
      /* editable controls — 16px font avoids iOS tap-zoom; generous hit areas for touch */
      .sc-input { background: #0e1219; color: #e7f0fb; border: 1px solid var(--line); border-radius: 5px;
        padding: 4px 6px; font: 16px ui-monospace, monospace; min-height: 28px; box-sizing: border-box; }
      .sc-input:focus { outline: none; border-color: var(--accent); }
      .sc-num { width: 64px; text-align: right; }
      .sc-axes { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
      .sc-axis { display: flex; align-items: center; gap: 2px; }
      .sc-axis-k { color: #6f93b8; font-size: 11px; width: 12px; text-align: center; }
      .sc-scrub { cursor: ew-resize; touch-action: none; }
      .sc-toggle { width: 22px; height: 22px; accent-color: var(--accent); }
      .sc-color { display: flex; align-items: center; gap: 5px; }
      .sc-swatch { width: 30px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 5px;
        background: none; cursor: pointer; }
      .sc-hex { width: 78px; }
      .sc-select { min-width: 96px; cursor: pointer; }
      #hint { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); padding: 6px 14px;
        border-radius: 8px; background: rgba(0,0,0,.55); color: #9fb5cf; font: 11px ui-monospace, monospace;
        pointer-events: none; }
      /* floating toolbars (touch-reachable, top center): play panel + movement panel */
      .sc-toolbars { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 6;
        display: flex; align-items: flex-start; gap: 8px; }
      .sc-toolbar { display: flex; align-items: center; gap: 2px; padding: 5px; border-radius: 12px;
        background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(6px); }
      .sc-tbtn { position: relative; width: 40px; height: 40px; display: flex; align-items: center;
        justify-content: center; padding: 0; border: 1px solid transparent; border-radius: 9px;
        background: transparent; color: #cfe0f2; cursor: pointer; }
      .sc-tbtn svg { width: 22px; height: 22px; display: block; }
      .sc-tbtn:hover:not(:disabled) { background: rgba(74, 240, 224, 0.12); color: #eafdff; }
      .sc-tbtn.active { background: rgba(74, 240, 224, 0.2); border-color: var(--accent); color: #eafdff; }
      .sc-tbtn:disabled { opacity: 0.3; cursor: default; }
      .sc-tbtn.sc-save.dirty { color: var(--accent); }
      .sc-tbtn.sc-save.dirty::after { content: ''; position: absolute; top: 7px; right: 7px;
        width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
      .sc-tbtn.sc-save.saving { opacity: 0.5; }
      .sc-tsep { width: 1px; height: 24px; background: var(--line); margin: 0 3px; }
      /* conflict banner: unsaved edits vs. an external file change */
      #sc-conflict { position: fixed; top: 62px; left: 50%; transform: translateX(-50%); z-index: 7;
        display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px;
        background: rgba(40, 26, 26, 0.96); border: 1px solid #6b3a3a; color: #ffd9d9;
        font: 13px ui-monospace, monospace; backdrop-filter: blur(6px); }
      #sc-conflict button { border: 1px solid #6b3a3a; border-radius: 7px; background: transparent;
        color: #ffd9d9; padding: 5px 10px; cursor: pointer; font: 12px ui-monospace, monospace; }
      #sc-conflict button:first-of-type { background: var(--accent); color: #0e1219; border-color: var(--accent); }
      #sc-conflict button:hover { filter: brightness(1.1); }
      /* component-load error banner: last-good is live, this says what's broken */
      #sc-error { position: fixed; top: 62px; left: 50%; transform: translateX(-50%); z-index: 7;
        display: flex; align-items: flex-start; gap: 10px; max-width: min(680px, 92vw);
        padding: 9px 13px; border-radius: 10px; background: rgba(44, 22, 14, 0.97);
        border: 1px solid #7a4326; color: #ffdcc2; font: 12px/1.45 ui-monospace, monospace;
        backdrop-filter: blur(6px); box-shadow: 0 10px 34px rgba(0, 0, 0, 0.5); }
      #sc-error > span { white-space: pre-wrap; overflow: auto; max-height: 34vh; }
      #sc-error button { flex: 0 0 auto; border: 1px solid #7a4326; border-radius: 7px; background: transparent;
        color: #ffdcc2; padding: 5px 10px; cursor: pointer; font: 12px ui-monospace, monospace; }
      #sc-error button:hover { filter: brightness(1.15); }
      /* start-up file picker: shown when the editor opens with no ?file= */
      .sc-picker { position: fixed; inset: 0; z-index: 8; display: flex; align-items: center;
        justify-content: center; background: rgba(10, 12, 18, 0.72); backdrop-filter: blur(4px); }
      .sc-picker-panel { width: min(440px, 88vw); max-height: 76vh; display: flex; flex-direction: column;
        background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
        font: 13px/1.5 ui-monospace, monospace; box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5); }
      .sc-picker-title { padding: 14px 18px; font-weight: 700; color: #9fe7ff; letter-spacing: 0.06em;
        text-transform: uppercase; font-size: 12px; border-bottom: 1px solid var(--line); }
      .sc-picker-list { overflow: auto; padding: 6px; }
      .sc-picker-row { width: 100%; display: flex; align-items: center; justify-content: space-between;
        gap: 10px; padding: 9px 12px; border: 0; border-radius: 8px; background: transparent; color: #e7f0fb;
        font: 13px ui-monospace, monospace; text-align: left; cursor: pointer; }
      .sc-picker-row:hover { background: rgba(74, 240, 224, 0.12); color: #eafdff; }
      .sc-picker-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sc-picker-kind { flex: 0 0 auto; color: #6f93b8; font-size: 11px; text-transform: uppercase;
        letter-spacing: 0.04em; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
      .sc-picker-empty { padding: 22px 18px; color: #8fa6c4; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="hint">tap to select · right-drag look · WASD move · Q/E down/up · G/R/Y gizmo move/rotate/scale</div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
