<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Breakout — SceNoCo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0e16;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 24px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.65);
        color: #4af0e0;
        font-family: ui-monospace, monospace;
        font-size: 18px;
        letter-spacing: 0.04em;
        pointer-events: none;
        white-space: nowrap;
      }
      #message {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 28px 44px;
        border-radius: 14px;
        background: rgba(10, 14, 22, 0.92);
        border: 1px solid #2a3a5e;
        color: #e0f0ff;
        font-family: ui-monospace, monospace;
        font-size: 19px;
        text-align: center;
        white-space: pre-wrap;
        pointer-events: none;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="hud">Score: 0&nbsp;&nbsp;&nbsp;Lives: ●●●</div>
    <div id="message"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
