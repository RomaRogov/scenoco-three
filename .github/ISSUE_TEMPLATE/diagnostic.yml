name: A message could be better
description: Something refused what you wrote — the runtime, `scenoco check` — but did not tell you what to write instead.
labels: [diagnostics]
body:
  - type: markdown
    attributes:
      value: |
        A refusal that does not carry the answer is a defect here, not a nitpick — the design bets
        on every message saying what to write instead.
  - type: textarea
    id: got
    attributes:
      label: What it said
      render: text
    validations: { required: true }
  - type: textarea
    id: wanted
    attributes:
      label: What would have unblocked you
      description: Ideally the exact text you eventually had to write.
    validations: { required: true }
