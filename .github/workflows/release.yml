name: Release

# Publishes every package at the version in its `package.json`. Tag and push to fire it:
#   git tag v0.9.5 && git push origin v0.9.5
#
# No token: npm trusts this workflow (trusted publishing, OIDC). Each package names
# RomaRogov/scenoco-three and this file, release.yml, as its publisher on npmjs.com, and npm adds a
# provenance attestation to every version published from here.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # the OIDC token npm's trusted publishing exchanges for a publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships with npm 10.
      - run: npm install -g npm@^11.5.1

      # Same two rules as CI: a committed lockfile so an upstream publish cannot change what
      # ships, and build first because the packages typecheck against each other's declarations.
      - run: node scripts/check-lockfile.mjs
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      # Last gate before publishing: the tarballs themselves, installed and used outside the
      # workspace. A release that passes every test above can still ship a package that does not
      # install — core@0.5.0 did.
      - run: npm run smoke:pack

      # Dependency order: everything peers on core; observer and tools stand alone.
      - name: Publish
        run: |
          set -euo pipefail
          for pkg in core box2d rapier particles audio splines terrain observer tools unity create editor; do
            dir="packages/$pkg"
            [ -d "$dir" ] || continue
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "· $name@$version already published — skipping"
            else
              echo "→ publishing $name@$version"
              npm publish -w "$dir" --access public
            fi
          done
