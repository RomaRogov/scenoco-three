name: Release

# Publishes every package at the version in its `package.json`. Tag and push to fire it:
#   git tag v0.6.0 && git push origin v0.6.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Same two rules as CI: a committed lockfile so an upstream publish cannot change what
      # ships, and build first because the packages typecheck against each other's declarations.
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      # Dependency order: everything peers on core; vite and observer sit on the compiler. The
      # editor depends on neither, so its position is free.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in core compiler collision box2d rapier ui postfx particles audio vite observer editor; do
            dir="packages/$pkg"
            [ -d "$dir" ] || continue
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "· $name@$version already published — skipping"
            else
              echo "→ publishing $name@$version"
              npm publish -w "$dir" --provenance --access public
            fi
          done
