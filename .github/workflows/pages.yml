# The project's site: the README as its front page, the examples playable, llms.txt for coding
# agents, and the editor's interface for a game page opened with ?edit=<this site>/editor.js.
# Runs by hand: publishing is the maintainer's call.
name: pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Same install as CI: the committed lockfile, so the site is built from what was tested.
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npm run site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
