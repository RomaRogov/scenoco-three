<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Spline Race</title>
    <link rel="icon" href="data:," />
    <style>
      :root { --ink: #0b1a2a; --paper: rgb(255 255 255 / 0.82); --red: #e2412f; }
      html, body { margin: 0; height: 100%; background: #9fc6e8; overflow: hidden; }
      body { font: 700 14px/1.3 system-ui, sans-serif; color: var(--ink); user-select: none; -webkit-user-select: none; }
      canvas { display: block; touch-action: none; }

      /* The race at a glance: place, lap, speed. */
      .hud { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; gap: 10px; pointer-events: none; }
      .card { padding: 8px 14px; border-radius: 12px; background: var(--paper); box-shadow: 0 4px 18px rgb(0 0 0 / 0.12); }
      .card small { display: block; font-size: 10px; letter-spacing: 0.16em; opacity: 0.6; }
      .card b { font-size: 24px; font-variant-numeric: tabular-nums; }
      .card.speed { margin-left: auto; text-align: right; }
      #assist, #camera { pointer-events: auto; cursor: pointer; border: 0; font: inherit; color: inherit; touch-action: none; }
      #assist::after { content: 'ON'; color: #1f8f4a; margin-left: 6px; }
      #assist.off::after { content: 'OFF'; color: var(--red); }

      /* 3 · 2 · 1 · GO */
      #count { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; font-size: clamp(64px, 18vw, 160px); font-weight: 900; color: #fff; text-shadow: 0 6px 30px rgb(0 0 0 / 0.35); }
      #count.pop { animation: pop 0.8s ease-out both; }
      @keyframes pop { from { scale: 1.6; opacity: 0; } 25% { scale: 1; opacity: 1; } to { opacity: 0; } }

      /* The finish. */
      #banner { position: fixed; inset: 0; display: grid; place-content: center; gap: 16px; text-align: center; background: rgb(11 26 42 / 0.45); cursor: pointer; animation: appear 0.5s ease both; }
      #banner[hidden] { display: none; }
      #result { font-size: clamp(40px, 11vw, 88px); font-weight: 900; color: #fff; }
      #banner span { color: #fff; opacity: 0.8; letter-spacing: 0.2em; }
      @keyframes appear { from { opacity: 0; } }

      /* Touch: labelled buttons, as the keys. */
      .pad { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; gap: 10px; }
      .pad.left { left: 14px; }
      .pad.right { right: 14px; }
      .pad button { min-width: 84px; height: 64px; padding: 0 10px; white-space: nowrap; border-radius: 16px; border: 0; background: var(--paper); font: 800 13px system-ui, sans-serif; color: var(--ink); box-shadow: 0 4px 18px rgb(0 0 0 / 0.15); touch-action: none; }
      .pad button:active { scale: 0.94; }
      #stick {
        position: relative; width: 176px; height: 64px; border-radius: 32px; background: rgb(255 255 255 / 0.45);
        box-shadow: inset 0 2px 10px rgb(0 0 0 / 0.15); touch-action: none;
      }
      #stick::before, #stick::after { position: absolute; top: 50%; translate: 0 -50%; font: 800 14px system-ui; color: var(--ink); opacity: 0.45; }
      #stick::before { content: '◀'; left: 14px; }
      #stick::after { content: '▶'; right: 14px; }
      #stick i {
        position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%;
        background: var(--paper); box-shadow: 0 4px 14px rgb(0 0 0 / 0.25); transition: translate 0.12s ease-out;
      }
      #stick:active i { transition: none; }
      .hint { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); translate: -50% 0; opacity: 0.75; white-space: nowrap; }
      @media (pointer: fine) { .pad { display: none; } }
      @media (pointer: coarse) { .hint { display: none; } }
      /* A gamepad connected: no touch controls, whatever the screen; the hint says the pad's. */
      .hint.pad-hint { display: none; }
      body.gamepad .pad, body.gamepad .hint:not(.pad-hint) { display: none; }
      body.gamepad .hint.pad-hint { display: block; }
    </style>
  </head>
  <body>
    <div class="hud">
      <div class="card"><small>PLACE</small><b id="place">–</b></div>
      <div class="card"><small>LAP</small><b id="lap">1/3</b></div>
      <button class="card" id="assist" data-button="Assist" title="Steering assist (H)"><small>ASSIST</small></button>
      <button class="card" id="camera" data-button="Camera" title="Camera (C)"><small>CAMERA</small>VIEW</button>
      <div class="card speed"><small>KM/H</small><b id="speed">0</b></div>
    </div>
    <div id="count"></div>
    <div id="banner" data-button="Again" hidden><div id="result"></div><span>TAP OR R TO RACE AGAIN</span></div>
    <!-- Steering: drag the knob left or right (TouchStick drives Input's Horizontal axis). -->
    <div class="pad left">
      <div id="stick" role="slider" aria-label="Steer: drag left or right"><i></i></div>
    </div>
    <div class="pad right">
      <button data-button="Brake">BRAKE</button>
      <button data-button="Gas">GAS</button>
    </div>
    <div class="hint">WASD / arrows drive · H steering assist · C camera</div>
    <div class="hint pad-hint">Stick steers · RT / A gas · LT / B brake · Y assist · X camera</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
