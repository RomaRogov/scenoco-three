<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Spline Race</title>
    <link rel="icon" href="data:," />
    <style>
      /* The page around the game: the UI below is UI Toolkit's, its USS here and its UXML in the body. */
      html, body { margin: 0; height: 100%; background: #9fc6e8; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
      canvas { display: block; }
      /* A button as UI Toolkit's: no look of the browser's own, its parent's text. */
      button { appearance: none; margin: 0; font: inherit; color: inherit; }

      :root { --ink: #0b1a2a; --red: #e2412f; }
      /* system-ui: the platform's own font, as Unity's default font is. */
      #ui, #loading { font-family: system-ui; font-size: 14px; font-weight: bold; color: var(--ink); }
      .label { font-size: 10px; letter-spacing: 1.6px; opacity: 0.6; }

      /* A panel's face is USS's own — colour, radius — and its soft shadow an image (tools/ui-images.mjs)
         on a .shade child placed outside it, nine-sliced in the image's pixels as -unity-slice-* is. */
      .card, .pad .button { position: relative; border-width: 0; background-color: rgba(255, 255, 255, 0.82); }
      .shade { position: absolute; border-width: 0; border-style: solid; }
      .card > .shade { left: -24px; top: -24px; right: -24px; bottom: -24px; border-image: url(/ui/card-shadow.png) 72 fill / 36px; }
      .pad .button > .shade { left: -24px; top: -24px; right: -24px; bottom: -24px; border-image: url(/ui/button-shadow.png) 80 fill / 40px; }

      /* The race at a glance: place, lap, speed. */
      .hud { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; flex-direction: row; }
      .card { margin-right: 10px; padding: 8px 14px; border-radius: 12px; }
      .card .value { font-size: 24px; }
      .card.speed { margin-left: auto; margin-right: 0; text-align: right; }
      #assist, #camera { pointer-events: auto; cursor: pointer; color: var(--ink); font-size: 14px; font-weight: bold; }
      #assist .value, #camera .value { font-size: 14px; }
      #assist-state { color: #1f8f4a; }
      #assist.off #assist-state { color: var(--red); }

      /* 3 · 2 · 1 · GO: in at once, large and clear; settling; then fading away. */
      #count { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-size: 160px; color: #ffffff; text-shadow: 0 6px 30px rgba(0, 0, 0, 0.35); opacity: 0; transition: opacity 0.6s ease-out; }
      #count.enter { scale: 1.6; opacity: 0; transition-duration: 0s; }
      #count.shown { scale: 1; opacity: 1; transition: scale 0.2s ease-out, opacity 0.2s ease-out; }

      /* The finish. */
      #banner { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background-color: rgba(11, 26, 42, 0.45); opacity: 0; transition: opacity 0.5s ease; }
      #banner.shown { opacity: 1; pointer-events: auto; cursor: pointer; }
      #result { font-size: 88px; color: #ffffff; margin-bottom: 16px; }
      #again { color: #ffffff; opacity: 0.8; letter-spacing: 2.8px; }

      /* Touch: labelled buttons, as the keys — shown on a touch screen with no gamepad. */
      .pad { position: absolute; bottom: 14px; display: none; flex-direction: row; }
      /* The stick sits higher than the buttons: a thumb steers from further up the screen than it presses. */
      .pad.left { left: 14px; bottom: 64px; }
      .pad.right { right: 14px; }
      .pad .button { min-width: 84px; height: 64px; margin-left: 10px; padding: 0 10px; border-radius: 16px; white-space: nowrap; font-size: 13px; font-weight: bold; color: var(--ink); pointer-events: auto; }
      .pad .button:active { scale: 0.94; }
      #stick { position: relative; width: 176px; height: 64px; border-radius: 32px; background-color: rgba(255, 255, 255, 0.45); pointer-events: auto; }
      #stick > .shade { left: 0; top: 0; right: 0; bottom: 0; border-image: url(/ui/track-shade.png) 64 fill / 32px; }
      #stick .arrow { position: absolute; top: 22px; font-size: 14px; opacity: 0.45; }
      #stick .arrow.back { left: 14px; }
      #stick .arrow.ahead { right: 14px; }
      #knob { position: absolute; left: 60px; top: 4px; width: 56px; height: 56px; border-radius: 28px; background-color: rgba(255, 255, 255, 0.82);
        transition: translate 0.12s ease-out; }
      #knob > .shade { left: -24px; top: -24px; right: -24px; bottom: -24px; background-image: url(/ui/knob-shadow.png); background-size: 100% 100%; }
      #stick:active #knob { transition-duration: 0s; }

      .hint { position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; opacity: 0.75; white-space: nowrap; }
      .hint.pad-hint { display: none; }
      #ui.touch .pad { display: flex; flex-direction: row; }
      #ui.touch .hint.keys { display: none; }
      /* A gamepad connected: no touch controls, whatever the screen; the hint says the pad's. */
      #ui.gamepad .pad { display: none; }
      #ui.gamepad .hint.keys { display: none; }
      #ui.gamepad .hint.pad-hint { display: flex; flex-direction: row; justify-content: center; }

      /* Until the track is loaded and drawn once: the page's own, before the game and its UI are there. */
      #loading { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; background-color: var(--ink); color: #ffffff; transition: opacity 0.5s ease; }
      #loading .title { font-size: 48px; letter-spacing: 3px; margin-bottom: 18px; }
      #loading-bar { width: 320px; height: 8px; border-radius: 4px; background-color: rgba(255, 255, 255, 0.15); overflow: hidden; margin-bottom: 18px; }
      #loading-fill { height: 100%; width: 0; background-color: var(--red); transition: width 0.25s ease-out; }
      #loading .label { letter-spacing: 3.4px; }
      #loading.done { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="ui">
      <div class="hud">
        <div class="card"><div class="shade"></div><div class="label">PLACE</div><div class="value" id="place">–</div></div>
        <div class="card"><div class="shade"></div><div class="label">LAP</div><div class="value" id="lap">1/3</div></div>
        <button class="card" id="assist" data-button="Assist" title="Steering assist (H)"><div class="shade"></div><div class="label">ASSIST</div><div class="value" id="assist-state">ON</div></button>
        <button class="card" id="camera" data-button="Camera" title="Camera (C)"><div class="shade"></div><div class="label">CAMERA</div><div class="value">VIEW</div></button>
        <div class="card speed"><div class="shade"></div><div class="label">KM/H</div><div class="value" id="speed">0</div></div>
      </div>
      <div id="count"></div>
      <div id="banner" data-button="Again"><div id="result"></div><div id="again">TAP OR R TO RACE AGAIN</div></div>
      <!-- Steering: drag the knob left or right (TouchStick drives Input's Horizontal axis). -->
      <div class="pad left">
        <div id="stick" role="slider" aria-label="Steer: drag left or right"><div class="shade"></div><div class="arrow back">◀</div><div class="arrow ahead">▶</div><div id="knob"><div class="shade"></div></div></div>
      </div>
      <div class="pad right">
        <button class="button" data-button="Brake"><div class="shade"></div>BRAKE</button>
        <button class="button" data-button="Gas"><div class="shade"></div>GAS</button>
      </div>
      <div class="hint keys">WASD / arrows drive · H steering assist · C camera</div>
      <div class="hint pad-hint">Stick steers · RT / A gas · LT / B brake · Y assist · X camera</div>
    </div>
    <div id="loading"><div class="title">SPLINE RACE</div><div id="loading-bar"><div id="loading-fill"></div></div><div class="label">LOADING</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
