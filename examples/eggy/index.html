<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Eggy Roll</title>
    <style>
      /* Unity's canvas is 1080 x 1920: --u is one of its units, so every size below is Unity's own. */
      :root { --u: min(100vw / 1080, 100dvh / 1920); --ink: #371e70; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1030; touch-action: none; user-select: none; -webkit-user-select: none; }
      #frame {
        position: relative; margin: 0 auto; height: 100dvh; width: min(100vw, 100dvh * 9 / 16); overflow: hidden;
        /* UIGradient: color1 at the top, color2 at the bottom. */
        background: linear-gradient(#fffecb, #d6007b);
        font-family: 'Chalkboard SE', 'Chalkboard', 'Comic Sans MS', cursive; color: var(--ink);
      }
      #frame canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
      #title { position: absolute; left: 0; right: 0; top: 20%; transform: translateY(-50%); text-align: center; font-size: calc(200 * var(--u)); font-weight: bold; }
      #play { position: absolute; left: 50%; top: 74%; width: calc(532.7 * var(--u)); height: calc(303.8 * var(--u)); margin: calc(-151.9 * var(--u)) 0 0 calc(-266.35 * var(--u));
        background: url(/textures/play.png) center / 100% 100% no-repeat; border: 0; padding: 0; cursor: pointer; }
      #level { position: absolute; left: 0; right: 0; bottom: calc(-84.8 * var(--u) - 25 * var(--u)); text-align: center; color: white; font-size: calc(93 * var(--u)); font-weight: bold; pointer-events: none; }
      #stars { position: absolute; left: 0; right: 0; top: 0; height: 10%; display: flex; align-items: center; justify-content: center; gap: calc(10 * var(--u)); pointer-events: none; }
      #stars img { width: calc(258.3 * var(--u) * 0.6); }
      #count { font-size: calc(80 * var(--u)); font-weight: bold; }
      #fade { position: absolute; inset: 0; background: #000; opacity: 1; pointer-events: none; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="frame">
      <div id="title">Eggy Roll</div>
      <button id="play" aria-label="Play"><div id="level">LEVEL 1</div></button>
      <div id="stars"><img src="/textures/star.png" alt="" /><span id="count">0</span></div>
      <div id="fade"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
