<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Breakout — SceNoCo</title>
    <style>
      html,
      body {
        margin: 0;
        /* `100dvh` tracks the *visible* viewport as the mobile browser's address
           bar shows/hides; plain `100%`/`100vh` size against the tallest state,
           so a canvas anchored to it can end up with its bottom half hidden
           behind the browser chrome. `100%` stays as a fallback for browsers
           without dvh support. */
        height: 100%;
        height: 100dvh;
        background: #0a0e16;
        overflow: hidden;
        overscroll-behavior: none; /* no pull-to-refresh / rubber-band scroll */
        touch-action: none; /* the engine's InputManager asks for this: stops the
                                page scrolling/zooming so single-touch drives play
                                (drag the paddle, tap to launch) instead of the
                                browser's own gestures */
        position: fixed;
        inset: 0;
        -webkit-user-select: none;
        user-select: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #hud {
        position: fixed;
        /* env(safe-area-inset-top) clears the notch/status-bar area on phones
           that have one; 0px on everything else. */
        top: calc(14px + env(safe-area-inset-top, 0px));
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 24px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.65);
        color: #4af0e0;
        font-family: ui-monospace, monospace;
        font-size: 18px;
        letter-spacing: 0.04em;
        pointer-events: none;
        white-space: nowrap;
      }
      #message {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 28px 44px;
        border-radius: 14px;
        background: rgba(10, 14, 22, 0.92);
        border: 1px solid #2a3a5e;
        color: #e0f0ff;
        font-family: ui-monospace, monospace;
        font-size: 19px;
        text-align: center;
        white-space: pre-wrap;
        pointer-events: none;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="hud">SPACE/tap launch · ←→ / A D / drag move</div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
