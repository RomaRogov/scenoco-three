<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SceNoCo Playground</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        max-width: 60ch;
        padding: 10px 14px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.55);
        color: #cfe8ff;
        font-family: ui-monospace, monospace;
        font-size: 13px;
        white-space: pre-wrap;
      }
      #hud.error {
        color: #ff9b9b;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="hud"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
